name: A股每日复盘

on:
  schedule:
    # 收盘后跑两次，确保当天数据当天入库。
    # 用非整点分钟（23/37 分）避开 GitHub Actions 整点扎堆排队——实测整点任务
    # 常延迟 4~6 小时，跑到北京深夜甚至跨过午夜，会把当天记成前一交易日。
    # 第一次：北京时间 19:23（UTC 11:23）
    - cron: '23 11 * * 1-5'
    # 第二次兜底：北京时间 21:37（UTC 13:37）。同一交易日重复跑只会覆盖那一行，
    # 不会产生重复记录；若第一次被延迟错过，这次能把当天补回来。
    - cron: '37 13 * * 1-5'
  workflow_dispatch:      # 允许在 GitHub 网页上手点「Run workflow」手动触发

permissions:
  contents: write         # 要往回提交 data/

env:
  TZ: Asia/Shanghai       # 不加这个，日志和 update_time 会是 UTC，比北京时间晚 8 小时

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 取数并推送
        env:
          SCT_SENDKEY:        ${{ secrets.SCT_SENDKEY }}
          FEISHU_APP_ID:      ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET:  ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_TABLE_TOKEN: ${{ secrets.FEISHU_TABLE_TOKEN }}
        run: python scripts/cloud_run.py

      - name: 把当天数据提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新复盘数据 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
